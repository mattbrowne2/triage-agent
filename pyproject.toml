[project]
name = "incident-triage"
version = "0.1.0"
description = "Incident triage agent over Datadog-style logs, built with LangChain and evaluated with LangSmith"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain>=1.0,<2",
    "langchain-anthropic>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "numpy>=2,<3",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "python-dotenv>=1.1,<2",
    "uvicorn>=0.32,<1",
]

[project.scripts]
incident-triage = "incident_triage.main:main"
generate-mock-logs = "mock_logs.main:main"
error-monitor = "monitor.main:main"
run-evals = "evals.main:main"
calibrate-judge = "evals.judge.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-random-order>=1.2,<2",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.12",
    "ty>=0.0.1a20",
]
ui = [
    "gradio>=5,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals", "src/incident_triage", "src/mock_logs", "src/monitor", "src/triage_api", "src/triage_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
filterwarnings = ["ignore:ast.Str is deprecated:DeprecationWarning:langsmith"]

[tool.ruff]
line-length = 120
indent-width = 4
include = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "C90", "UP"]
ignore = ["E203"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["tests", ".venv", "src/triage_ui"]
